extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.0"
    import: ["@key", "@shareable"]
  )

type Query {
  gameSummaries(cursor: String): GameSummaryConnection!
  gameSummary(appId: Int!): GameSummary
}

type GameSummaryConnection {
  count: Int!
  cursor: String
  items: [GameSummary!]!
}

type GameSummary
  @key(fields: "appId") {
  appId: Int!
  name: String!
  developer: String
  publisher: String
  positive: Int
  negative: Int
  owners: Int
  dateAdded: String!
}
